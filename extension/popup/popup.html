<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Identity Mirror</title>
    <style>
      body { font-family: system-ui; width: 340px; padding: 12px; }
      input, select, button, textarea { width: 100%; box-sizing: border-box; margin-top: 8px; }
      .row { margin-top: 10px; }
      .small { font-size: 12px; opacity: 0.8; }
      .ok { color: #0a7a0a; }
      .err { color: #b00020; }
    </style>
  </head>
  <body>
    <h3>Identity Mirror</h3>

    <div class="row">
      <label class="small">API Base URL</label>
      <input id="apiBase" placeholder="http://localhost:3000" />
    </div>

    <div class="row">
      <label class="small">Bearer Token (userId.secret)</label>
      <textarea id="token" rows="3" placeholder="Paste token from Account → Extension Tokens"></textarea>
    </div>

    <div class="row">
      <button id="save">Save</button>
      <div id="status" class="small"></div>
    </div>

    <div id="connection-status" class="row" style="display: none;">
      <div id="status-info" class="small"></div>
      <button id="disconnect-btn" style="display: none; margin-top: 8px;">Disconnect</button>
    </div>

    <hr />

    <div class="row">
      <button id="ping">Test Connection</button>
      <div id="pingResult" class="small"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
